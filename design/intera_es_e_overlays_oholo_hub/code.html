<style>
        /* Custom Custom Cursor Styles */
        body {
            cursor: none;
        }
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background-color: #000000;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease, border 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .custom-cursor.hover {
            width: 60px;
            height: 60px;
            background-color: transparent;
            border: 2px solid #E01F26; /* Using explicit red as requested for cursor */
        }
        
        .custom-cursor-text {
            color: #E01F26;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .custom-cursor.hover .custom-cursor-text {
            opacity: 1;
        }

        /* Loading Screen Animation */
        .loading-progress {
            width: 0%;
            animation: load 2.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes load {
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; }
        }

        .fade-out {
            animation: fadeOut 0.5s ease forwards;
            animation-delay: 2.6s;
        }

        @keyframes fadeOut {
            from { opacity: 1; visibility: visible; }
            to { opacity: 0; visibility: hidden; }
        }

        /* Form Input Styles */
        .input-hairline {
            border: none;
            border-bottom: 1px solid #E4E6E9;
            border-radius: 0;
            padding: 12px 0;
            background: transparent;
            transition: border-color 0.3s ease;
        }
        .input-hairline:focus {
            outline: none;
            border-bottom-color: #E01F26;
            box-shadow: none;
        }
        
        /* Select specific styles */
        select.input-hairline {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right center;
            background-size: 16px;
        }
        
        /* Modal Backdrop */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
        }
        
        /* Scrollbar hiding for showcase */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>

<body class="bg-background text-primary antialiased relative min-h-screen overflow-hidden">
<!-- Custom Cursor -->
<div class="custom-cursor" id="customCursor">
<span class="custom-cursor-text">VER</span>
</div>
<!-- Initial Loading State -->
<div class="fixed inset-0 z-[100] bg-primary flex flex-col items-center justify-center fade-out">
<div class="font-headline-lg text-headline-lg font-black text-on-primary uppercase tracking-tighter mb-8">

<div class="absolute top-0 left-0 h-full bg-[#E01F26] loading-progress"></div>

<!-- Showcase Container -->
<main class="w-full h-screen relative flex items-center justify-center p-gutter-side">

<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#1b1b1b 1px, transparent 1px); background-size: 40px 40px;"></div>
<!-- Showcase Content (Behind Modal) -->

<h1 class="font-display-hero text-display-hero mb-stack-md text-primary">Interações Institucionais</h1>
<p class="font-body-main text-body-main text-outline mb-stack-lg">Mova o cursor para ver a interação. O modal abaixo exemplifica o agendamento de reuniões, utilizando a linguagem visual de alta precisão do OHOLO HUB.</p>

<!-- Custom Cursor Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cursor = document.getElementById('customCursor');
            const hoverTriggers = document.querySelectorAll('.hover-trigger');

            // Move cursor
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });

            // Handle hover states for interactive elements
            hoverTriggers.forEach(trigger => {
                trigger.addEventListener('mouseenter', () => {
                    cursor.classList.add('hover');
                });
                trigger.addEventListener('mouseleave', () => {
                    cursor.classList.remove('hover');
                });
            });
            
            // Hide custom cursor when leaving window
            document.addEventListener('mouseout', (e) => {
                if (e.relatedTarget === null) {
                    cursor.style.display = 'none';
                }
            });
            document.addEventListener('mouseover', () => {
                cursor.style.display = 'flex';
            });
        });
    </script>
